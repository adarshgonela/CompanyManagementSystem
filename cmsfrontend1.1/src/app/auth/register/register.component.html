		<!-- Main Wrapper -->
		<div class="inner-wrapper login-body">
			<div class="login-wrapper">
				<div class="container">
					<div class="loginbox shadow-sm grow">
						<div class="login-left">
							<img class="img-fluid" src="assets/img/logo.png" alt="Logo">
						</div>
						<div class="login-right">
							<div class="login-right-wrap">
								<h1>Register</h1>
								<p class="account-subtitle">Access to our dashboard</p>
								
								<!-- Form -->
								<form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
									<div class="form-group">
									  <input
										formControlName="name"
										class="form-control"
										type="text"
										placeholder="Name"
									  />
									</div>
									<div class="form-group">
									  <input
										formControlName="email"
										class="form-control"
										type="email"
										placeholder="Email"
									  />
									</div>
									<div class="form-group">
									  <input
										formControlName="password"
										class="form-control"
										type="password"
										placeholder="Password"
									  />
									</div>
									<div class="form-group">
									  <input
										formControlName="confirmPassword"
										class="form-control"
										type="password"
										placeholder="Confirm Password"
									  />
									</div>
									<div class="form-group mb-0">
									  <button
										class="btn btn-theme button-1 text-white ctm-border-radius btn-block"
										type="submit"
										[disabled]="registrationForm.invalid"
									  >
										Register
									  </button>
									</div>
								  </form>
								  
								<!-- /Form -->
								
								<div class="login-or">
									<span class="or-line"></span>
									<span class="span-or">or</span>
								</div>
								
								<!-- Social Login -->
								<div class="social-login">
									<span>Register with</span>
									<a href="javascript:void(0)" class="facebook"><i class="fa fa-facebook"></i></a><a href="javascript:void(0)" class="google"><i class="fa fa-google"></i></a>
								</div>
								<!-- /Social Login -->
								
								<div class="text-center dont-have">Already have an account? <a href="login.html">Login</a></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
